openapi: 3.0.3
info:
  title: HomeIOT Device API
  version: 1.0.0
  description: |
    Tightened v1 contract for HomeIOT device-server integration.

    Rules:
    - Authentication headers are mandatory on every endpoint.
    - Header identity is authoritative (X-Device-ID).
    - Heartbeat returns only mode-based runtime control (no role/admin_exec_enabled).
    - Development mode is additive: modules still run, and dev command polling is enabled.
    - Dev commands are execute-on-change (revision_hash) unless forceRerun=true.
servers:
  - url: http://localhost:8000
    description: Local development

security:
  - DeviceIdHeader: []
    ApiKeyHeader: []

paths:
  /api/devices/register:
    post:
      summary: Register or refresh device record
      operationId: registerDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Registered or refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '201':
          description: Newly registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Invalid payload or body/header device identity mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/devices/heartbeat:
    post:
      summary: Send device heartbeat and receive runtime metadata
      operationId: heartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatRequest'
      responses:
        '200':
          description: Heartbeat accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatResponse'
        '400':
          description: Invalid payload or body/header mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/ota/check:
    get:
      summary: Check OTA availability
      operationId: checkOta
      parameters:
        - name: X-Current-Version
          in: header
          required: false
          schema:
            type: string
          description: Optional client hint mirroring the current firmware version.
        - name: version
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Update decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtaCheckResponse'
        '400':
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/ota/file:
    get:
      summary: Download OTA file
      operationId: downloadOtaFile
      parameters:
        - name: version
          in: query
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Binary OTA content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: OTA artifact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/devices/logs:
    post:
      summary: Upload batched logs
      operationId: uploadLogs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogBatchRequest'
      responses:
        '200':
          description: Logs accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/devices/dev-commands/next:
    get:
      summary: Get next development command (development mode only)
      description: |
        Poll interval should be around 2000ms with jitter.
        Device executes command only if revision_hash changed or forceRerun=true.
      operationId: getNextDevCommand
      parameters:
        - name: last_revision_hash
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Development command available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevCommandResponse'
        '204':
          description: No command available
        '400':
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Device not in development mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/devices/dev-commands/{commandId}/result:
    post:
      summary: Submit development command execution result
      operationId: submitDevCommandResult
      parameters:
        - name: commandId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevCommandResultRequest'
      responses:
        '200':
          description: Result recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Command not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/devices/modules/assignment:
    get:
      summary: Get module assignment metadata
      operationId: getModuleAssignment
      parameters:
        - name: last_assignment_hash
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Assignment available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleAssignmentResponse'
        '204':
          description: No assignment changes
        '400':
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/devices/modules/package:
    get:
      summary: Download module package
      operationId: downloadModulePackage
      parameters:
        - name: module_id
          in: query
          required: true
          schema:
            type: string
        - name: version
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Binary module package
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Package not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/devices/modules/results:
    post:
      summary: Submit module execution result
      operationId: submitModuleResult
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleResultRequest'
      responses:
        '200':
          description: Result recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/devices/modules/status:
    post:
      summary: Submit module quarantine or re-enable status
      operationId: submitModuleStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleStatusRequest'
      responses:
        '200':
          description: Status recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    DeviceIdHeader:
      type: apiKey
      in: header
      name: X-Device-ID
      description: Device identity header (authoritative).
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Device API key.

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required: [error]

    StatusResponse:
      type: object
      properties:
        status:
          type: string
      required: [status]

    RegisterRequest:
      type: object
      properties:
        device_id:
          type: string
        platform:
          type: string
          enum: [esp32, pico]
        version:
          type: string
        ip:
          type: string
        timestamp:
          type: integer
      required: [device_id, version]

    RegisterResponse:
      type: object
      properties:
        status:
          type: string
        device_id:
          type: string
      required: [status, device_id]

    HeartbeatRequest:
      type: object
      properties:
        device_id:
          type: string
        timestamp:
          type: integer
        uptime_ms:
          type: integer
        free_memory_bytes:
          type: integer
      required: [device_id, timestamp]

    HeartbeatResponse:
      type: object
      properties:
        status:
          type: string
        server_time_utc:
          type: string
          format: date-time
        mode:
          type: string
          enum: [production, development]
        dev_poll_interval_ms:
          type: integer
        module_assignment_poll_interval_ms:
          type: integer
        next_heartbeat_ms:
          type: integer
      required: [status, mode]

    OtaManifestItem:
      type: object
      properties:
        path:
          type: string
        hash:
          type: string
      required: [path, hash]

    OtaCheckResponse:
      type: object
      properties:
        available:
          type: boolean
        version:
          type: string
        manifest:
          type: array
          items:
            $ref: '#/components/schemas/OtaManifestItem'
      required: [available]

    LogEntry:
      type: object
      properties:
        ts:
          type: integer
        level:
          type: string
        message:
          type: string
        context:
          type: object
          additionalProperties: true
      required: [ts, level, message]

    LogBatchRequest:
      type: object
      properties:
        device_id:
          type: string
        reason:
          type: string
        sentAt:
          type: integer
        dropped_count:
          type: integer
        truncated:
          type: boolean
        logs:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
      required: [device_id, reason, sentAt, logs]

    DevCommandResponse:
      type: object
      properties:
        command_id:
          type: string
        revision_hash:
          type: string
        code:
          type: string
        timeout_ms:
          type: integer
        forceRerun:
          type: boolean
        dedupe_token:
          type: string
        expires_at_utc:
          type: string
          format: date-time
        signature:
          type: string
      required: [command_id, revision_hash, code, timeout_ms, forceRerun, dedupe_token]

    DevCommandResultRequest:
      type: object
      properties:
        command_id:
          type: string
        revision_hash:
          type: string
        dedupe_token:
          type: string
        status:
          type: string
          enum: [success, timeout, error, skipped_duplicate]
        started_at_utc:
          type: string
          format: date-time
        finished_at_utc:
          type: string
          format: date-time
        elapsed_ms:
          type: integer
        exit_code:
          type: integer
        stdout:
          type: string
        stderr:
          type: string
      required: [command_id, revision_hash, dedupe_token, status, started_at_utc, finished_at_utc, elapsed_ms]

    ModuleAssignmentItem:
      type: object
      properties:
        module_id:
          type: string
        version:
          type: string
        interval_ms:
          type: integer
        timeout_ms:
          type: integer
        package_hash:
          type: string
        signature:
          type: string
        enabled:
          type: boolean
      required: [module_id, version, interval_ms, timeout_ms, package_hash, signature]

    ModuleAssignmentResponse:
      type: object
      properties:
        assignment_hash:
          type: string
        modules:
          type: array
          items:
            $ref: '#/components/schemas/ModuleAssignmentItem'
      required: [assignment_hash, modules]

    ModuleResultRequest:
      type: object
      properties:
        device_id:
          type: string
        module_id:
          type: string
        module_version:
          type: string
        run_id:
          type: string
        started_at_utc:
          type: string
          format: date-time
        finished_at_utc:
          type: string
          format: date-time
        elapsed_ms:
          type: integer
        status:
          type: string
          enum: [success, timeout, error]
        output:
          type: object
          additionalProperties: true
        error_message:
          type: string
        metrics:
          type: object
          additionalProperties: true
      required: [device_id, module_id, module_version, run_id, started_at_utc, finished_at_utc, elapsed_ms, status]

    ModuleStatusRequest:
      type: object
      properties:
        device_id:
          type: string
        module_id:
          type: string
        module_version:
          type: string
        disabled:
          type: boolean
        disabled_reason:
          type: string
        failed_start_count:
          type: integer
        disabled_at_utc:
          type: string
          format: date-time
      required: [device_id, module_id, module_version, disabled]

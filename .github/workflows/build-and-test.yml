name: Test & Build

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch: {}

jobs:
  # Python tests for edge device code
  python-tests:
    name: Python Tests (Edge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run tests
        working-directory: ./edge
        run: python -m pytest --tb=short

  # .NET tests for API
  dotnet-tests:
    name: .NET Tests (API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        working-directory: ./api
        run: dotnet restore

      - name: Run tests
        working-directory: ./api/tests
        run: dotnet test homeiot.api.tests.csproj --verbosity normal

  # React/TypeScript tests
  react-tests:
    name: React Tests (Web UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './web-ui/package-lock.json'

      - name: Install dependencies
        working-directory: ./web-ui
        run: npm ci

      - name: Run tests
        working-directory: ./web-ui
        run: npm run test

  # Build Docker image and run E2E tests
  build-and-test:
    name: Build Docker & E2E Tests
    runs-on: ubuntu-latest
    needs: [python-tests, dotnet-tests, react-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node for Playwright
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './web-ui/package-lock.json'

      - name: Install dependencies
        working-directory: ./web-ui
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./web-ui
        run: npx playwright install --with-deps chromium

      - name: Build Docker image
        run: |
          docker build -f Dockerfile -t homeiot-api:${{ github.sha }} -t homeiot-api:latest .

      - name: Start container
        run: |
          docker run -d \
            -p 5228:5228 \
            -v homeiot-data:/app/data \
            -v homeiot-artifacts:/app/artifacts \
            -v homeiot-modules:/app/modules \
            --name homeiot-api-test \
            homeiot-api:latest

      - name: Wait for container to be ready
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:5228/health > /dev/null 2>&1; then
              echo "Container is ready"
              exit 0
            fi
            echo "Waiting for container... ($i/30)"
            sleep 2
          done
          echo "Container failed to start"
          docker logs homeiot-api-test
          exit 1

      - name: Run Playwright E2E tests
        working-directory: ./web-ui
        run: |
          BASE_URL=http://localhost:5228 npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web-ui/playwright-report/
          retention-days: 30

      - name: Cleanup
        if: always()
        run: docker stop homeiot-api-test || true

      - name: Show container logs on failure
        if: failure()
        run: docker logs homeiot-api-test || true

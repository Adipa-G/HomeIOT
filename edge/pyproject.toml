# Python tooling for the edge runtime (tests, type check, simulator and edge tools).
# Nothing here is deployed to devices; releases are built by edge/tools/build_artifact.py.
[project]
name = "homeiot-edge"
version = "0.1.0"
description = "HomeIOT edge runtime tooling"
requires-python = ">=3.11"
dependencies = [
    # CPython HTTP client for the simulator and edge tools.
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-mock==3.14.0",
    "pyright==1.1.414",
    # MicroPython API types for pyright (machine, network, ntptime, ...). Devices run
    # ESP32 >= 1.30 and Pico W >= 1.28; bump when 1.30 stubs are published.
    # Pico-only modules are stubbed in typings/.
    "micropython-esp32-stubs~=1.29.0",
    "mpy-cross==1.28.*",
    # CPython requests types for the simulator; takes priority over the MicroPython
    # requests stub that micropython-esp32-stubs installs.
    "types-requests>=2.33.0.20261030",
]

[tool.uv]
# Not an installable package, only a managed environment.
package = false

[tool.pytest.ini_options]
testpaths = ["."]

[tool.pyright]
include = ["."]
exclude = [".venv", "**/__pycache__", "**/.pytest_cache"]
# Code imports itself as `edge.…`, so resolve it from the repository root.
extraPaths = [".."]
pythonVersion = "3.11"
pythonPlatform = "Linux"
typeCheckingMode = "standard"
# Folders moved to strict mode so far; add one at a time as each is fully typed.
strict = [
    "platforms/*/hal",
    "platforms/*/src",
    "simulator",
    "tools",
]
venvPath = "."
venv = ".venv"
stubPath = "typings"
# MicroPython modules are stub-only (the implementation is in the firmware).
reportMissingModuleSource = "none"

version: '3.8'

services:
  api:
    image: adipa/homeiot
    container_name: homeiot
    ports:
      - "5228:5228"
    environment:
      ASPNETCORE_ENVIRONMENT: Release
      ASPNETCORE_URLS: http://0.0.0.0:5228
      # Change these for production
      ADMIN__MASTERUSERNAME: Admin
      ADMIN__MASTERPASSWORD: "123"
    volumes:
      # Persist SQLite database between container restarts (named volume for portability)
      - homeiot-data:/app/data
      # Persist OTA artifacts (named volume for portability)
      - homeiot-artifacts:/app/artifacts
      # Persist uploaded modules (named volume for portability)
      - homeiot-modules:/app/modules
    restart: unless-stopped
    networks:
      - homeiot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5228/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  homeiot-data:
    driver: local
  homeiot-artifacts:
    driver: local
  homeiot-modules:
    driver: local

networks:
  homeiot-network:
    driver: bridge
